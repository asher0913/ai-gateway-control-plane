name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[server,dev]'
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts
      - run: pytest -q
      - name: Simulation reproduces the committed results
        run: |
          aigw simulate --out /tmp/simulation.json
          python -c "import json; a=json.load(open('/tmp/simulation.json')); b=json.load(open('results/simulation.json')); assert a == b, 'results drifted'; print('reproduced exactly')"
