[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-gateway-control-plane"
version = "0.1.0"
description = "A provider-neutral model gateway control plane with capability routing, token and concurrency limits, budget settlement, circuit breaking, prompt versioning, and auditable decisions."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Asher"}]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["ai_gateway_control_plane*"]
